<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
</head>
<body>
    <ul>
        <a href="mailto:adv.danielfm@gmail.com">
            <li>E-mail</li>
        </a>
        <a href="tel:+351912334535">
            <li>Telefone</li>
        </a>
    </ul>
    <form method="POST" onsubmit="enviarForm(event)">
        <label for="nome">Nome:</label>
        <input id="nome" type="text" placeholder="Digite seu nome" required>
        <br>
        <label for="email">E-mail:</label>
        <input id="email" type="email" placeholder="Digite seu e-mail" required>
        <br>
        <label for="assunto">Assunto:</label>
        <select id="assunto">
            <option>Recrutamento</option>
            <option>Freelance</option>
            <option>Outro</option>
        </select>
        <br>
        <label for="mensagem">Mensagem</label>
        <textarea rows="5" minlength="10" placeholder="Escreve aqui a sua proposta" required></textarea>
        <button type="submit">Enviar ✅</button>
    </form>
    <script>
        function enviarForm(event) {
            event.preventDefault();
            alert("Obrigado pelo contacto! Responderei em breve.");
        }
    </script>
</body>
</html>
